<!DOCTYPE html>
<html>
<head>
    <title>Xbox Launcher</title>
    <style>
        body { background: #000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; cursor: pointer; }
        .bg { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .prompt { color: white; font-family: 'Segoe UI', sans-serif; font-size: 2rem; z-index: 10; text-shadow: 0 0 15px #107C10; }
    </style>
</head>
<body onclick="launch()">
    <!-- Your loading image -->
    <img src="1000016083.jpg" class="bg">
    <div class="prompt">CLICK ANYWHERE TO START XBOX</div>

    <script>
        function launch() {
            // The official URI protocol to launch a specific game
            window.location.href = "roblox-player:1+launchmode:play+placeid:13086985452";
        }
    </script>
</body>
</html>
